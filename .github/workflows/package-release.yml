name: Package V13.351 release

on:
  workflow_dispatch:
  push:
    branches:
      - v13.351

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v13.351

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/claim-your-hero-v13-351
          rsync -a --exclude='.git' --exclude='package' ./ package/claim-your-hero-v13-351/
          rm -rf package/claim-your-hero-v13-351/.github
          cd package
          zip -r ../claim-your-hero-v13-351.zip claim-your-hero-v13-351

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: claim-your-hero-v13-351
          path: package/claim-your-hero-v13-351
          if-no-files-found: error

      - name: Create or update GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v13.351 \
            --repo "${{ github.repository }}" \
            --title "Claim Your Hero V13.351" \
            --notes "V13.351 distribution package for Foundry VTT." \
            claim-your-hero-v13-351.zip \
            || gh release upload v13.351 claim-your-hero-v13-351.zip --repo "${{ github.repository }}" --clobber
